name: Build and Deploy CyTOS Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Build Production Bundle
        run: npm run build

      # Automatically keeps the 'production' branch updated with compiled HTML/CSS/JS for Hostinger Git
      - name: 🚀 Update Production Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: production
          folder: dist
          commit-message: "Automated production build from commit ${{ github.sha }}"

      # Optional direct FTP upload to Hostinger if secrets are configured
      - name: 📡 Direct Deploy to Hostinger via FTP (Optional)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.HOSTINGER_FTP_SERVER != ''
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
